name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build Release
        run: dotnet build -c Release --no-restore

      - name: Validate benchmark catalog
        run: dotnet run --project src/PerformanceLab.Cli -c Release --no-build -- validate

      - name: Test Release
        run: dotnet test -c Release --no-build --verbosity normal

  benchmark-smoke:
    runs-on: ubuntu-latest
    needs: build-test-validate

    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: perf_lab_dev
          POSTGRES_DB: perf_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d perf_lab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build Release
        run: dotnet build -c Release --no-restore

      - name: Quick benchmark smoke
        env:
          PERFLAB_POSTGRES: Host=localhost;Port=5432;Database=perf_lab;Username=postgres;Password=perf_lab_dev
        run: dotnet run --project src/PerformanceLab.Cli -c Release --no-build -- run --benchmark dictionary-vs-list --quick

      - name: Database benchmark smoke
        env:
          PERFLAB_POSTGRES: Host=localhost;Port=5432;Database=perf_lab;Username=postgres;Password=perf_lab_dev
        run: dotnet run --project src/PerformanceLab.Cli -c Release --no-build -- run --benchmark tracking-vs-no-tracking --quick
